expert_time_estimate_hours = 8
relevant_experience = "Technical leader with more than 10 years in automotive software and embedded systems at Aptiv, delivering real time embedded ADAS software to automotive quality standards. Both sides of this task are part of that work. On the storage side I have worked on the non volatile data an ADAS ECU has to keep across ignition cycles, sensor alignment and learned calibration among it, which on these parts means emulating small writable blocks over internal flash that can only be erased a sector at a time: appending a new version of a block instead of rewriting it in place, checking a block against a checksum before it is believed, recovering at startup from whatever the last ignition off left behind, and keeping the erase count inside what the part is specified for over the life of the vehicle. On the real time side this storage is driven from a cyclic task with a fixed budget per cycle, so a sector erase that takes the part away for tens of milliseconds cannot be waited out inline and has to be carried across cycles as a state machine, while the startup path has to be ready inside the time the rest of the software is allowed to wait for it. The specific failure this task is built around is one I have had to deal with: the supply going away in the middle of the copy that moves live blocks into a freshly erased sector, where a recovery that simply prefers the newest sector hands back an incomplete copy, and a sector that has stopped erasing cleanly makes it worse by accepting the write and keeping the old bytes."
difficulty_explanation = "The agent writes the non volatile block store of an ECU as a program that is driven over a line protocol: the verifier owns the flash image, the clock and the power, serves one device operation at a time, kills the process at points the scenario fixes in advance, starts it again over the same image and then reads every block back. There is no recorded input to tune against and the ten graded scenarios run on four parts whose geometry, operation costs and erase window the agent never sees. Five pieces of judgement have to be right at once and four of them pull against each other. First, what a record has to carry to be believed: a program interrupted part way leaves a prefix of the page written and the rest erased, so taking a page as a record on its tag alone gives a corrupt read on one scenario and an outright exit mid tick on another, because the length read out of a half written page is not a length. Second, the order in which a compaction becomes visible: live data has to move to a fresh sector while the old one stays authoritative until the new one is complete, which needs a marker written after the copy and a mount that prefers the newest sector carrying that marker rather than the newest sector, and choosing by generation alone costs 429 stale reads against a bar of zero. Nine of the forty nine resets in the graded set land inside an erase and thirty inside a program, many of those inside that copy. Third, an erase is a request and not a fact: on some parts a sector starts keeping a few of its pages from its second erase onwards while reporting success, so a sector has to be read back before it is trusted, and trusting it costs 31 violations, with the damage arriving indirectly when the new header is programmed over an old one and the next reset recovers the previous generation. Fourth, an acknowledgement is a promise about the part and not about memory: a store that holds everything in memory and acknowledges on arrival passes every other measure and loses 863 blocks, and acknowledging at queue time rather than after the page is programmed costs 49. Fifth, the budgets, which is where both directions are punished: 2.0 ms of device time per tick is about five page programs and an erase takes the part away for three or four ticks, so doing all outstanding work at once overruns 222 times, while programming one record every eight ticks leaves the worst write 764 ticks late and 423 writes never acknowledged at all against a 35 tick bar. The mount is bounded at 8.0 ms of device time, which rules out rebuilding the index from every page of every sector at 28.475 ms, and endurance is measured rather than assumed, with compaction started thirty pages early reaching 9.558 erases per 100 writes against a bar of 6.0. The data is synthetic and this is disclosed: a seeded generator writes the workload and the reset points before any store runs, so the values grading compares against are the ones the workload asked for and never come from a solver, and the reset points are fixed at a request ordinal and then at a kind of operation, so two unrelated designs take their resets at the same points in the workload. The device model, the driver, the metric code, three development scenarios and a protocol skeleton are all given to the agent, because the difficulty here is the design rather than withheld information; what the graded set varies is what a development run cannot show by itself, four geometries instead of one, between two and seven resets, runs long enough for the rotation to come back to a worn sector two or three times, and resets aimed at an erase and at the first programs after one. A GPU would be idle: this is a sequential tick loop issuing a handful of device operations over 24 blocks of at most 32 bytes, so gpus is 0."
solution_explanation = "solution/nvm_store.py keeps a log of records inside one active sector. Page 0 of every sector holds a header with a generation number, page 1 holds a seal that is programmed only once that sector holds a complete copy of every live block, and records are appended one to a page from page 2 upwards, each carrying its block, its length, a record sequence number and a checksum over all of it. A half programmed page therefore fails its checksum and is skipped, and because the append point is the first wholly erased page such a page is never written over. Mount reads the sector headers, one seal and the pages of the active sector, which is enough because compaction copies every live record forward, and that is what keeps the mount inside its budget. When the active sector fills, compaction erases the next sector in rotation, reads every page back to prove the erase took and retires the sector if it did not, writes the new header, copies the newest record of each live block and writes the seal last, so a reset anywhere inside that sequence leaves the old sector sealed and authoritative and the new one unsealed and ignored, at the cost of doing the work again. Each write is read back after its page is programmed and acknowledged only then. Work is metered against the tick budget with reads answered first so a read is never held up behind compaction, and the erase verify is split across ticks because on the deepest part it is 2.56 ms of reads on its own."
verification_explanation = "tests/harness.py keeps the flash image, the clock, the resets and every counter inside the verifier process, so the program under test can reach none of them: it is started as an unprivileged user in an empty directory, in its own session, and its process group is killed in a finally block. What survives a reset used to be the whole argument and twice that was wrong: a review defeated a harness that reused one working directory across resets, and an adversarial probe then beat the sweep that replaced it by journalling into /run/lock, which is mode 1777 in the base image and was not on the list. Grading no longer rests on a list of places to clear. A value handed back after a reset has to be present in the flash image the harness holds, byte for byte and in one piece, and so does every acknowledged value when the run ends, which a store that kept the blocks in memory, in a file or in a daemon cannot satisfy however well its copy survived. The sweep remains as defence in depth and now discovers what to clear by walking the image for directories that user can write to instead of naming them, alongside each boot getting a new working directory and a copy of the program it cannot write to, the removal of the shared memory, queues and semaphores it owns, and the killing of every process still running as that user. A later probe kept the blocks in a daemon that re execs itself without the marker and listens on an abstract socket, issued no device operation during the workload, and programmed the values it held into blank pages while the read back was running, so the bytes were in the image exactly when the check looked; the comparison is therefore against the image frozen at the instant of the cut, and again before the read back that ends a run, so nothing written after the power is gone can answer for durability. The read back also no longer numbers its requests in a range of its own. Three probes are kept under authoring/evidence/cheats, the last two rebuilt from the run audits, and they fail at 1344, 1344 and 1200 violations while a store that never leaves memory fails at 863. With the sweep switched off completely, so that every journal and every daemon survives untouched, all three still fail at 1344, of which 1104 are values that were not on the part when the supply went, and the memory store at 863, while the reference and the independent store stay at 0, so neither the isolation nor the sweep is what the bars rest on. authoring/evidence/check_durability_semantics.py asserts the property directly. test.sh makes /logs/verifier root owned and mode 700 before pytest starts and tests/Dockerfile bakes /tests with chmod -R go-rwx, which an attempt that writes to /logs/verifier/reward.txt and globs /tests confirms: every write is refused with permission denied, every glob returns zero files and reward.txt is unchanged. The truth is the request stream itself, written by authoring/provenance/generate_scenarios.py before any store runs. After every reset and at the end of each scenario every block is read back, and a read has to return the newest acknowledged value or the value of a write that had been delivered but not acknowledged when the supply went; an older value, a value belonging elsewhere, NONE where something was acknowledged, or a read left unanswered all count as violations. Five bars over the ten scenarios together, all computed by tests/scoring.py which the evidence scripts import as well: zero integrity violations, no mount above 8.0 ms of device time, no tick above its 2.0 ms budget, every write acknowledged within 35 ticks with none outstanding at the end, and at most 6.0 erases per 100 acknowledged writes. The reference scores 0 violations, 2.880 ms, 0 overruns, 11 ticks and 2.491 erases per 100 writes, and three repeated verifier runs on its output gave identical numbers. A second correct store written to a different design, a circular log over the whole part with index snapshots and reclamation of the oldest sector instead of compaction forward, scores 0, 2.900 ms, 0, 12 ticks and 1.894, and five perturbations of the reference own constants all pass with the worst at 17 ticks and 3.207 erases per 100 writes, so every bar sits between the weakest correct store and the strongest broken one and the pass does not depend on one tuning. Each bar is the sole reason some variant fails: dropping the record checksum, the seal, the erase verify or the late acknowledgement fails integrity alone at 1 violation plus a crash, 429, 31 and 49; the same ablation test applied to the independently written store rather than only to the reference shows four of its five pieces biting at 3 plus a crash, 2, 118 and 6 violations, with the fifth, an index snapshot refreshed before a sector is reclaimed, measurably redundant and reported as such rather than claimed; the only plausible dodge of the mount bar, spending nothing at MOUNT and scanning the part from inside the ticks while answering reads BUSY, was built and fails at 1161 violations and 2 tick overruns; doing every job immediately fails the tick budget alone at 222 overruns; scanning every sector at mount fails the mount bar alone at 28.475 ms; compacting thirty pages early fails endurance alone at 9.558; and programming one record every two or every eight ticks fails the acknowledgement bar alone at 54 and 764 ticks. The quick attempt of the kind written in a few minutes loses 1096 blocks, the shipped skeleton fails integrity and acknowledgement, and a store that never touches the part at all fails integrity at 863, which is what shows the resets carry that bar rather than the workload. Read latency, worst tick time, lost writes and per sector erase counts are written to /logs/verifier/metrics.json but deliberately not graded, since the read contract already bounds latency and wear is even by construction in both correct designs. Everything here is reproduced by python authoring/evidence/evaluate.py, which rescores the reference, eleven ablations of it, five perturbations, the independent store with five ablations of its own, the shortcut and the skeleton and writes results.json beside the results.md table, and python authoring/evidence/bundle_checks.py rechecks the structural rules and the past review findings mechanically after any edit."

