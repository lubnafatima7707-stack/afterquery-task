[task]
name = "afterquery/ecu-nvm-store"
description = "Write the non volatile block store of an engine control unit so that several hundred blocks, filling three fifths of the pages a log can write records to, survive power cuts placed inside page programs, sector erases and the reclaim copy, on four flash parts it never sees, while holding a mount budget, a per tick device budget and an erase budget."
authors = [{ name = "Meheboob Ulla Khan", email = "raqibkhan7756@gmail.com" }]
keywords = ["non volatile memory", "nor flash", "power fail safety", "crash consistency", "wear and endurance", "real time embedded software", "automotive ecu software"]

