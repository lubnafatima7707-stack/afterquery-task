expert_time_estimate_hours = 12
relevant_experience = "Technical leader with more than 10 years in automotive software and embedded systems at Aptiv, delivering real time embedded ADAS software to automotive quality standards. Both sides of this task are part of that work. On the storage side I have worked on the non volatile data an ADAS ECU has to keep across ignition cycles, sensor alignment and learned calibration among it, which on these parts means emulating small writable blocks over internal flash that can only be erased a sector at a time: appending a new version of a block instead of rewriting it in place, checking a block against a checksum before it is believed, recovering at startup from whatever the last ignition off left behind, and keeping the erase count inside what the part is specified for over the life of the vehicle. On the real time side this storage is driven from a cyclic task with a fixed budget per cycle, so a sector erase that takes the part away for tens of milliseconds cannot be waited out inline and has to be carried across cycles as a state machine, while the startup path has to be ready inside the time the rest of the software is allowed to wait for it. The specific failure this task is built around is one I have had to deal with: the supply going away in the middle of the copy that moves live blocks into a freshly erased sector, where a recovery that simply prefers the newest sector hands back an incomplete copy, and a sector that has stopped erasing cleanly makes it worse by accepting the write and keeping the old bytes."
difficulty_explanation = "The agent writes the non volatile block store of an ECU as a program driven over a line protocol: the verifier owns the flash image, the clock and the power, serves one device operation at a time, kills the process at points the scenario fixes in advance, starts it again over the same image and then reads blocks back. There is no recorded input to tune against and the ten graded scenarios run on four parts whose geometry, operation costs and erase window the agent never sees. What sets the level is the size of the live set: between 490 and 700 blocks are live at once, about half of every page on the part and close to three fifths of the pages a log can put records in once it holds sectors back to erase into, so the whole part has to be run as a log with sectors reclaimed out of it under power cuts, and five pieces of judgement have to be right at once with four of them pulling against each other. First, what a record has to carry to be believed: a program interrupted part way leaves a prefix of the page written and the rest erased, so taking a page as a record on its tag alone gives 3 corrupt reads and an outright exit mid tick on a second scenario, because the length read out of a half written page is not a length. Second, what orders two copies of a block: the part carries several versions of most blocks, so a mount needs a generation on each sector, applied in order, and a per sector record of what each page holds so closed sectors are not read page by page; applying the sectors in sector order instead costs 1000 violations against a bar of zero, 870 of them a block coming back as a version it had thousands of writes earlier. Forty nine resets land across the graded set, thirty one of them inside a program and nine inside an erase for the reference and thirty two and nine for the independently written store, many of those inside the reclaim copy. Third, an erase is a request and not a fact: on some parts a sector keeps a few of its pages from its second erase onwards while reporting success, so a sector has to be read back before it is trusted, and trusting it costs 99 violations and strands 965 writes, while the opposite mistake of giving a sector up the first time it reads back written, when a reset merely left it half wiped, strands 461. Fourth, an acknowledgement is a promise about the part and not about memory: a store that holds everything in memory and acknowledges on arrival passes every other measure and loses 9207 blocks, and acknowledging at queue time rather than after the page is programmed costs 6. Fifth, the budgets, which punish both directions: 2.0 ms of device time per tick is about five page programs and an erase takes the part away for three or four ticks, so doing all outstanding work at once overruns 1763 times, while programming one record every eight ticks leaves the worst write 2942 ticks late with 2858 never acknowledged against a 35 tick bar. The mount is bounded at 8.0 ms of device time, which rules out rebuilding the index from every page of every sector at 27.875 ms, and endurance is measured rather than assumed at 5.0 erases per 100 writes: starting the reclaim while twenty pages of the open sector are still free reaches 8.082, and holding six sectors blank instead of two reaches 6.267 while failing nothing else. A store that merely works is not the end of it: a log across a full part deadlocks in ways a log across an empty one does not, since a sector cannot be given up until its live records are copied somewhere, the somewhere has to be blank, and a blank sector is made by giving one up. The data is synthetic and this is disclosed: a seeded generator writes the workload and the reset points before any store runs, so the values grading compares against are the ones the workload asked for and never come from a solver, and the reset points are fixed at a request ordinal and then at a kind of operation, so two unrelated designs take their resets at the same points in the workload. The device model, the driver, the metric code, three development scenarios and a protocol skeleton are all given to the agent, because the difficulty here is the design rather than withheld information; what the graded set varies is what a development run cannot show by itself, four geometries instead of one, between two and seven resets, runs long enough for the rotation to come back to a worn sector, and resets aimed at an erase and at the first programs after one. A GPU would be idle: this is a sequential tick loop issuing a handful of device operations over blocks of at most 32 bytes, so gpus is 0."
solution_explanation = "solution/nvm_store.py runs the whole part as an append only log. Page 0 of a sector holds a header with the generation it was opened at, records are appended one to a page from page 1 upwards, each carrying its block, its length, a record sequence number and a checksum over all of it, so a half programmed page fails its checksum and is skipped, and because the append point is the first wholly erased page such a page is never written over. The last few pages of a sector are kept for a summary, written when the sector is closed, listing the block held in every page of it, so a mount reads the sector headers, one summary per closed sector in generation order and the pages of the one sector still open, and a summary a reset spoiled costs a scan of that sector alone. Reclaim is where the run is decided with the part this full: the store keeps a live count per sector and takes the one holding the fewest live records, so a sector whose blocks have mostly been rewritten costs almost no copying. Copies are ordinary appends, so a reset in the middle of one leaves both the old record and the partial copy and the newer generation wins, and the victim is erased only once its last live record is out of it. The erase is read back page by page before the sector is used again and tried a second time before the sector is given up, since a reset inside an erase leaves a sector reading exactly like a worn one. Two sectors are kept blank rather than one, because a sector is only given up after a second erase of it reads back written, and by then its live records are already in the open sector with no room there to reclaim another; the spare blank sector is what the part rolls onto in that case, and writes stop short of the end of the open sector by what the next reclaim will need while nothing is blank. Each write and each copy is read back after its page is programmed, and a write is acknowledged only then. Work is metered against the tick budget with reads answered first so a read is never held up behind a reclaim, and the erase verify is split across ticks because on the deepest part it is more than a tick of reads on its own."
verification_explanation = "tests/harness.py keeps the flash image, the clock, the resets and every counter inside the verifier process, so the program under test can reach none of them: it is started as an unprivileged user in an empty directory, in its own session, and its process group is killed in a finally block. What survives a reset used to be the whole argument and twice that was wrong: a review defeated a harness that reused one working directory across resets, and an adversarial probe then beat the sweep that replaced it by journalling into /run/lock, which is mode 1777 in the base image and was not on the list. Grading no longer rests on a list of places to clear. A value handed back after a reset has to be present in the flash image the harness holds, byte for byte and in one piece, and so does every acknowledged value when the run ends, which a store that kept the blocks in memory, in a file or in a daemon cannot satisfy however well its copy survived. The sweep remains as defence in depth and now discovers what to clear by walking the image for directories that user can write to instead of naming them, alongside each boot getting a new working directory and a copy of the program it cannot write to, the removal of the shared memory, queues and semaphores it owns, and the killing of every process still running as that user. A later probe kept the blocks in a daemon that re execs itself without the marker and listens on an abstract socket, issued no device operation during the workload, and programmed the values it held into blank pages while the read back was running, so the bytes were in the image exactly when the check looked; the comparison is therefore against the image frozen at the instant of the cut, and again before the read back that ends a run, so nothing written after the power is gone can answer for durability. The read back also no longer numbers its requests in a range of its own. Seven hostile programs are kept under authoring/evidence/cheats, two of them rebuilt from the run audits; three are stopped before a bar is reached at all and the file backed, run lock journal and lazy materialise probes each fail at 11338 violations while a store that never leaves memory fails at 9207. With every isolation measure switched off, so that one working directory is reused across every boot, the sweep is a no operation and only the program itself is killed, all of them still fail, 10378 of each count being values that were not on the part when the supply went, while the reference and the independent store stay at 0; authoring/evidence/isolation_off.json carries those numbers, so neither the isolation nor the sweep is what the bars rest on. authoring/evidence/check_durability_semantics.py asserts the property directly. test.sh makes /logs/verifier root owned and mode 700 before pytest starts and tests/Dockerfile bakes /tests with chmod -R go-rwx, which an attempt that writes to /logs/verifier/reward.txt and globs /tests confirms: every write is refused with permission denied, every glob returns zero files and reward.txt is unchanged. The truth is the request stream itself, written by authoring/provenance/generate_scenarios.py before any store runs. After every reset a sample of the blocks is read back and at the end of each scenario every block is, and a read has to return the newest acknowledged value or the value of a write that had been delivered but not acknowledged when the supply went; an older value, a value belonging elsewhere, NONE where something was acknowledged, or a read left unanswered all count as violations. Five bars over the ten scenarios together, all computed by tests/scoring.py which the evidence scripts import as well: zero integrity violations, no mount above 8.0 ms of device time, no tick above its 2.0 ms budget, every write acknowledged within 35 ticks with none outstanding at the end, and at most 5.0 erases per 100 acknowledged writes. The reference scores 0 violations, 2.380 ms, 0 overruns, 4 ticks and 2.384 erases per 100 writes. A second correct store written to a different design, a single map sector rotated through the blank pool carrying a whole index checkpoint written each time a log sector is opened, with no summary kept inside a log sector and a mount that reads the newest checkpoint and the one sector of log it does not describe, scores 0, 4.020 ms, 0, 7 ticks and 3.110, and nine perturbations of the reference own constants and of choices a second author could reasonably have made differently all pass with the worst at 35 ticks and 3.872 erases per 100 writes, so every bar sits between the weaker correct store and the nearest broken one and the pass does not depend on one tuning. Each bar is the sole reason some variant fails: dropping the record checksum, applying the sectors at mount in sector order, or acknowledging on arrival fails integrity alone at 3 violations plus a crash, 1000 and 6; dropping the per sector summaries fails the mount bar alone at 27.875 ms; doing every job in the tick it arrives in fails the tick budget alone at 1763 overruns; keeping one blank sector rather than two, giving a sector up after a single erase, or closing the open sector ten pages early each fails the acknowledgement bar alone at 461 writes stranded; and holding six sectors blank fails the endurance bar alone at 6.267. The same ablation test applied to the independently written store rather than only to the reference shows all five of its pieces biting, at 3 violations plus a crash, 26.625 ms of mount, 70 violations with 504 writes stranded, 4 violations, and 1 violation with 1106 stranded. Three switches are reported as guards rather than claimed as ablations, because removing them leaves every number on the graded set unchanged: the reclaim reserve, the gap between erases and the read back of a reclaim copy. The quick attempt of the kind written in a few minutes loses 9180 blocks and fails endurance at 54.172 as well, the shipped skeleton fails integrity at 7808 with 4043 writes never acknowledged, and a store that never touches the part at all fails integrity at 9207, which is what shows the resets carry that bar rather than the workload. Read latency, worst tick time, lost writes and per sector erase counts are written to /logs/verifier/metrics.json but deliberately not graded, since the read contract already bounds latency and wear is even by construction in both correct designs. Everything here is reproduced by python authoring/evidence/evaluate.py, which rescores the reference, fourteen ablations of it, nine perturbations, three guards, the independent store with five ablations of its own, the shortcut, the skeleton and the four probes that get through a scenario at all, and writes results.json beside the results.md table, and python authoring/evidence/bundle_checks.py rechecks the structural rules and the past review findings mechanically after any edit."

